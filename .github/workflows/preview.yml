name: Preview APK (Profile)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ⚡ Gradle Build Cache
      - name: Setup Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Setup Java 11
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.16.0'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      # ⚡ Profile Mode — حجم صغير وأداء حقيقي
      - name: Build Profile APK (ARM64 only)
        run: flutter build apk --profile --target-platform android-arm64

      - name: Upload Profile APK
        uses: actions/upload-artifact@v4
        with:
          name: app-profile
          path: build/app/outputs/flutter-apk/app-profile.apk
          retention-days: 3
